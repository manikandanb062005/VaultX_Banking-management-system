spring.application.name=vaultx-backend

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/vaultx_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=vaultx
spring.datasource.password=vaultx_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=8080

# ---------- JWT ----------
# 256-bit+ secret used to sign tokens - change this in production and load from env instead
app.jwt.secret=vaultx-super-secret-key-change-me-in-production-1234567890
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
